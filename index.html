<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #f5f5f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      min-height: 100vh;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 28px; margin-bottom: 10px; color: #fbbf24; }
    .rank { font-size: 24px; color: #fbbf24; margin: 20px 0; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 30px 0;
    }
    .stat-box {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }
    .stat-value { font-size: 32px; font-weight: bold; color: #fbbf24; }
    .stat-label { font-size: 12px; color: #888; margin-top: 10px; text-transform: uppercase; }
    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }
    .card h2 { font-size: 16px; margin-bottom: 15px; text-transform: uppercase; color: #aaa; }
    .water-track {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }
    .water-glass {
      flex: 1;
      height: 40px;
      border: 2px solid #333;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
    }
    .water-glass.filled {
      background: #06b6d4;
      border-color: #06b6d4;
    }
    .water-glass:hover { border-color: #555; }
    .prayer-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .prayer-btn {
      padding: 12px;
      border: 2px solid #333;
      background: transparent;
      color: #999;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .prayer-btn:hover { border-color: #555; }
    .prayer-btn.checked {
      background: #10b981;
      border-color: #10b981;
      color: #fff;
    }
    button { cursor: pointer; }
    .info { color: #666; font-size: 12px; margin-top: 10px; }
    .nav {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    .nav-btn {
      padding: 10px 16px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #999;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 12px;
    }
    .nav-btn:hover, .nav-btn.active { background: #fbbf24; color: #000; border-color: #fbbf24; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ JARVIS</h1>
    <p style="color: #888; font-size: 12px;">Personal Operating System</p>

    <div id="dashboard">
      <div class="rank">
        <span id="rankName">Recruit</span> · <span id="expDisplay">0</span> EXP
      </div>

      <div class="stats">
        <div class="stat-box">
          <div class="stat-value" id="streak">0</div>
          <div class="stat-label">Streak (days)</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="progress">0%</div>
          <div class="stat-label">Progress</div>
        </div>
      </div>

      <div class="card">
        <h2>Water Intake</h2>
        <div class="water-track" id="waterTrack"></div>
        <div class="info">Tap glasses to log water · +5 EXP per glass</div>
      </div>

      <div class="card">
        <h2>5 Daily Prayers</h2>
        <div class="prayer-grid" id="prayerGrid"></div>
        <div class="info">+10 EXP per prayer</div>
      </div>

      <div class="card" style="background: #0d3b2e; border-color: #10b981;">
        <p style="font-size: 14px; color: #10b981;">✓ Data saves automatically to your browser</p>
      </div>
    </div>

    <div class="nav">
      <button class="nav-btn active" onclick="showDashboard()">Dashboard</button>
      <button class="nav-btn" onclick="alert('Full app coming soon! This is the beta.')">Goals</button>
      <button class="nav-btn" onclick="alert('Full app coming soon!')">More Tabs</button>
    </div>
  </div>

  <script>
    const RANKS = [
      { name: 'Recruit', min: 0 },
      { name: 'Initiate', min: 500 },
      { name: 'Operative', min: 1500 },
      { name: 'Specialist', min: 3500 },
      { name: 'Agent', min: 7000 },
      { name: 'Elite Agent', min: 12000 },
      { name: 'Commander', min: 20000 },
      { name: 'JARVIS', min: 100000 },
    ];

    const PRAYERS = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];

    let data = {
      exp: 0,
      streak: 0,
      water: 0,
      prayers: {}
    };

    function load() {
      const saved = localStorage.getItem('jarvis-data');
      if (saved) {
        data = JSON.parse(saved);
      }
      PRAYERS.forEach(p => { if (!data.prayers[p]) data.prayers[p] = false; });
      render();
    }

    function save() {
      localStorage.setItem('jarvis-data', JSON.stringify(data));
    }

    function addExp(amount) {
      data.exp += amount;
      save();
      render();
    }

    function getRank() {
      let current = RANKS[0];
      for (let r of RANKS) {
        if (data.exp >= r.min) current = r;
      }
      return current;
    }

    function render() {
      const rank = getRank();
      document.getElementById('rankName').textContent = rank.name;
      document.getElementById('expDisplay').textContent = data.exp.toLocaleString();
      document.getElementById('streak').textContent = data.streak;
      document.getElementById('progress').textContent = '42%';

      // Water
      const waterTrack = document.getElementById('waterTrack');
      waterTrack.innerHTML = '';
      for (let i = 0; i < 8; i++) {
        const glass = document.createElement('button');
        glass.className = 'water-glass' + (i < data.water ? ' filled' : '');
        glass.onclick = () => {
          data.water = i < data.water ? i : i + 1;
          if (i + 1 > (data.water - 1)) addExp(5);
          save();
          render();
        };
        waterTrack.appendChild(glass);
      }

      // Prayers
      const prayerGrid = document.getElementById('prayerGrid');
      prayerGrid.innerHTML = '';
      PRAYERS.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'prayer-btn' + (data.prayers[p] ? ' checked' : '');
        btn.textContent = p;
        btn.onclick = () => {
          data.prayers[p] = !data.prayers[p];
          if (data.prayers[p]) addExp(10); else addExp(-10);
          save();
          render();
        };
        prayerGrid.appendChild(btn);
      });
    }

    function showDashboard() {
      alert('You are on the dashboard!');
    }

    load();
  </script>
</body>
</html>
